name: CI

on: [push, pull_request]
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

  coverage:
    name: Report coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test --experimental-test-coverage test.cjs

  test:
    strategy:
      matrix:
        node-version: [22, 24]
        os: [ubuntu-22.04, macos-14, windows-2022]

    name: Test for node-${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  test-alpine:
    strategy:
      matrix:
        node-version: [22, 24]

    name: Test for node-${{ matrix.node-version }} on Alpine Linux
    runs-on: ubuntu-latest

    container:
      image: node:${{ matrix.node-version }}-alpine

    steps:
      - name: Install build deps
        run: apk add git

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
